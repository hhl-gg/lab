apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: webserver
    env: testing
  name: webserver
spec:
  replicas: 10
  selector:
    matchLabels:
      app: webserver
  template:
    metadata:
      labels:
        app: webserver
        env: development
    spec:
      containers:
      - image: httpd:alpine3.18
        name: httpd
  strategy:
    type: Recreate
